name: Linting

on:
  push:
    paths:
      - 'v3/**/*.py'
      - '**/linting.yml'
      - 'pylintrc'
      - 'v3/pyproject.toml'

  pull_request:

  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        python-version: [3.12]
    steps:
    - uses: actions/checkout@master
      with:
        persist-credentials: false
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Cache Poetry dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pypoetry
        key: ${{ runner.os }}-poetry-${{ hashFiles('v3/pyproject.toml') }}
        restore-keys: |
          ${{ runner.os }}-poetry-
    - name: Install Poetry
      run: |
        python -m pip install poetry
    - name: Install dependencies
      working-directory: v3  # Set the working directory to v3 where pyproject.toml is located
      run: |
        poetry install --with test,server
    - name: Testing with pylint
      working-directory: v3  # Ensure pylint runs in the correct directory
      run: |
        poetry run pylint . --rcfile=../pylintrc  # Run within the poetry venv
